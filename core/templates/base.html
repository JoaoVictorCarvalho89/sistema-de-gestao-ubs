{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UBS System - Sistema de Saúde{% endblock %}</title>
    
    <!-- Apenas CSS do Bootstrap 5 e Bootstrap Icons (Sem JS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'index.css' %}">
</head>
<body>

    <!-- Menu Lateral -->
    <aside class="sidebar">
        <div class="brand-box">
            <div class="brand-icon">
                <i class="bi bi-plus-lg"></i>
            </div>
            <div>
                <div class="fw-bold fs-5 lh-1">UBS System</div>
                <small class="text-secondary" style="font-size: 0.75rem;">Sistema de Saúde</small>
            </div>
        </div>

        <nav class="nav flex-column nav-ubs">
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
                <i class="bi bi-house-door"></i> Início
            </a>
            <a class="nav-link" href="#">
                <i class="bi bi-people"></i> Pacientes
            </a>
            <a class="nav-link" href="#">
                <i class="bi bi-calendar-event"></i> Agendamentos
            </a>
            <a class="nav-link" href="#">
                <i class="bi bi-clipboard2-pulse"></i> Consultas
            </a>
            <a class="nav-link" href="#">
                <i class="bi bi-file-medical"></i> Prontuários
            </a>
            <a class="nav-link" href="#">
                <i class="bi bi-shield-plus"></i> Vacinação
            </a>
            <a class="nav-link" href="#">
                <i class="bi bi-capsule"></i> Medicamento
            </a>
            <a class="nav-link" href="#">
                <i class="bi bi-bar-chart-line"></i> Relatórios
            </a>
        </nav>
    </aside>

    <!-- Conteúdo -->
    <div class="main-wrapper">
        <!-- Barra de Pesquisa e Perfil -->
        <header class="row align-items-center g-3 mb-4">
            <div class="col-md-7 col-lg-6">
                <form method="GET" action="">
                    <input type="text" name="q" class="form-control search-bar" 
                           placeholder="Buscar paciente por nome, cpf ou prontuário"
                           value="{{ request.GET.q|default:'' }}">
                </form>
            </div>
            <div class="col-md-5 col-lg-6 d-flex justify-content-md-end">
                <div class="top-user-box">
                    <span class="badge bg-primary-subtle text-primary rounded-pill">Médico</span>
                    <span class="small fw-semibold text-dark">Dr. Miguel</span>
                    <i class="bi bi-person-circle fs-5 text-secondary"></i>
                </div>
            </div>
        </header>

        {% block content %}{% endblock %}
    </div>

</body>
</html>
